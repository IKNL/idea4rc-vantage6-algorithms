[project]
name = "v6-sessions"
version = "1.0.0"
description = "This will extract a dataset from a set of patient IDs from the OMOP database and returns a dataframe used by vantage6 to create a dataframe."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "vantage6-algorithm-tools==5.0.0b1",
    "v6-idea4rc-common",
    "pandas==2.3.3",
    "pyarrow",
    "parquet-tools",
    # Python 3.13 requires rpy2 3.6.x
    "rpy2==3.6.6",
    "rpy2-rinterface==3.6.5",
    "rpy2-robjects==3.6.4",
    "numpy==1.26.4",
    "ohdsi-common",
    "ohdsi-database-connector",
    "ohdsi-sqlrender"
]

[tool.setuptools]
packages = ["v6-sessions"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["sql/*.sql.j2"]

[tool.uv.sources]
v6-idea4rc-common = { path = "../v6-idea4rc-common" }

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
