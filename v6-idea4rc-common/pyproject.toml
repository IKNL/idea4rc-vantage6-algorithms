[project]
name = "v6-idea4rc-common"
version = "0.1.0"
description = "Shared type conversion helpers for v6 packages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.3.3",
]

[tool.setuptools]
packages = ["v6_idea4rc_common"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
